<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<div class="contenedor">

    <div class="titulo">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTygiB2BROgfDKkQPcDOD0qwk8ZEuny7OyWDQDO7aadgQ&s"  alt="Logo de estudiante">

        <h2>Registro de Estudiantes</h2>
    </div>

    <form id="formulario">

        <div class="grupo">
            <label><i class="fa-solid fa-user"></i> Nombre</label>
            <input type="text" id="nombre" required>
        </div>

        <div class="grupo">
            <label><i class="fa-solid fa-user"></i> Apellido</label>
            <input type="text" id="apellido" required>
        </div>

        <div class="grupo">
            <label><i class="fa-solid fa-calendar"></i> Edad</label>
            <input type="number" id="edad" required>
        </div>

        <div class="grupo">
            <label><i class="fa-solid fa-id-card"></i> Cédula</label>
            <input type="text" id="cedula" required>
        </div>

        <div class="grupo">
            <label><i class="fa-solid fa-book"></i> Curso</label>
            <select id="curso" required>
                <option value="">Seleccione un curso</option>
                <option>Programación</option>
                <option>Ética</option>
                <option>Redes</option>
            </select>
        </div>

        <button type="submit">
            <i class="fa-solid fa-floppy-disk"></i>
            Registrar
        </button>

        <button type="button" id="limpiar">
            <i class="fa-solid fa-broom"></i>
            Limpiar
        </button>

    </form>

    <div id="resultado"></div>

</div>

<script src="script.js"></script>

</body>

</html>
