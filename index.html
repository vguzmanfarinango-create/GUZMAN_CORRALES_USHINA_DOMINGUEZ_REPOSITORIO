<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .contenedor{
            width:450px;
            background:white;
            border-radius:18px;
            padding:30px;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
            animation:aparecer .8s;
        }

        @keyframes aparecer{

            from{
                opacity:0;
                transform:translateY(-30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

        .titulo{
            text-align:center;
            margin-bottom:25px;
        }

        .titulo img{
            width:80px;
            height:80px;
            object-fit:cover;
            border-radius:50%;
            margin-bottom:10px;
        }

        .titulo h2{
            color:#333;
        }

        .grupo{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:6px;
            color:#444;
            font-weight:600;
        }

        label i{
            color:#0d6efd;
        }

        input,
        select{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:10px;
            transition:.3s;
            font-size:15px;

        }


        input:focus,
        select:focus{

            border-color:#0d6efd;
            outline:none;
            box-shadow:0 0 10px rgba(13,110,253,.3);

        }


        .botones{

            display:flex;
            gap:10px;

        }


        button{

            width:100%;
            padding:14px;
            color:white;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-size:17px;
            transition:.3s;

        }


        .registrar{

            background:#0d6efd;

        }


        .registrar:hover{

            background:#084dbf;
            transform:scale(1.02);

        }


        .limpiar{

            background:#dc3545;

        }


        .limpiar:hover{

            background:#a71d2a;
            transform:scale(1.02);

        }


        #resultado{

            margin-top:25px;
            padding:20px;
            border-radius:10px;
            background:#eaf4ff;
            display:none;

        }


        #resultado h3{

            color:#0d6efd;
            margin-bottom:12px;

        }


        #resultado p{

            margin:8px 0;

        }


    </style>

</head>


<body>


<div class="contenedor">


    <div class="titulo">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTygiB2BROgfDKkQPcDOD0qwk8ZEuny7OyWDQDO7aadgQ&s"
        alt="Logo de estudiante">

        <h2>Registro de Estudiantes</h2>

    </div>



    <form id="formulario">


        <div class="grupo">

            <label>
                <i class="fa-solid fa-user"></i> Nombre
            </label>

            <input 
                type="text" 
                id="nombre"
                name="nombre"
                placeholder="Ingrese nombres"
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                required>

        </div>



        <div class="grupo">

            <label>
                <i class="fa-solid fa-user"></i> Apellido
            </label>

            <input 
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Ingrese apellidos"
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                required>

        </div>



        <div class="grupo">

            <label>
                <i class="fa-solid fa-calendar"></i> Edad
            </label>

            <input 
                type="number"
                id="edad"
                name="edad"
                min="5"
                max="100"
                placeholder="Ingrese edad"
                required>

        </div>



        <div class="grupo">

            <label>
                <i class="fa-solid fa-id-card"></i> Cédula
            </label>

            <input 
                type="text"
                id="cedula"
                name="cedula"
                minlength="10"
                maxlength="10"
                pattern="[0-9]{10}"
                placeholder="Ingrese 10 dígitos"
                required>

        </div>



        <div class="grupo">

            <label>
                <i class="fa-solid fa-book"></i> Curso
            </label>


            <select id="curso" name="curso" required>

                <option value="">Seleccione un curso</option>

                <option value="Programación">Programación</option>

                <option value="Ética">Ética</option>

                <option value="Redes">Redes</option>

            </select>

        </div>



        <div class="botones">

            <button type="submit" class="registrar">

                <i class="fa-solid fa-floppy-disk"></i>
                Registrar

            </button>


            <button type="reset" class="limpiar">

                <i class="fa-solid fa-trash"></i>
                Limpiar

            </button>


        </div>


    </form>



    <div id="resultado"></div>



</div>



<script src="script.js"></script>


</body>

</html>
